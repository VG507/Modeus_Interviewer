[project]
name = "modeus-interviewer"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi", "uvicorn", "sqlalchemy", "alembic", "httpx[socks]", "pydantic-settings", "PyYAML", "psycopg[binary]", "openpyxl"]

[project.optional-dependencies]
dev = ["pytest"]
# Voice answers in Telegram; the bot asks for text while this is not installed.
voice = ["faster-whisper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
