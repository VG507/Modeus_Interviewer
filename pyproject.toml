[project]
name = "modeus-interviewer"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi", "uvicorn", "sqlalchemy", "alembic", "httpx[socks]", "pydantic-settings", "PyYAML", "psycopg[binary]"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
